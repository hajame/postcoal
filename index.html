<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Coal</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #0a0a0a;
    color: #e5e5e5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    letter-spacing: 0.05em;
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    color: #ffffff;
    margin-bottom: 1.5rem;
  }

  .divider {
    width: 60px;
    height: 1px;
    background-color: #555;
    margin: 0 auto 2rem;
  }

  .message {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: #888;
    margin-bottom: 3rem;
  }

  .contact {
    font-size: 0.95rem;
    line-height: 2;
    color: #aaaaaa;
  }

  .contact .name {
    color: #e5e5e5;
    font-weight: 500;
  }

  .contact a {
    color: #aaaaaa;
    text-decoration: none;
    border-bottom: 1px solid #444;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  .contact a:hover {
    color: #ffffff;
    border-color: #ffffff;
  }
</style>
</head>
<body>
  <h1>Post Coal</h1>
  <div class="divider"></div>
  <p class="message">New Single "Háskóli", out 18.9.2026!</p>
</body>
</html>
